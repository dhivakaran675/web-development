<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Dhivakaran Web Development</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      background-color: #f4f4f4;
      margin: 0;
      padding: 40px;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
    }

    .container {
      background: white;
      padding: 30px;
      border-radius: 8px;
      box-shadow: 0 4px 8px rgba(0, 0, 0, 0.1);
      width: 320px;
      text-align: center;
    }

    h1 {
      margin-bottom: 20px;
      color: #1f9d55;
      font-size: 22px;
    }

    ul {
      list-style-type: none;
      padding: 0;
      margin: 0;
    }

    li {
      border-bottom: 1px solid #ddd;
    }

    li:last-child {
      border-bottom: none;
    }

    a {
      display: block;
      padding: 15px 20px;
      color: #333;
      text-decoration: none;
      transition: background 0.3s, color 0.3s;
    }

    a:hover {
      background-color: #1f9d55;
      color: white;
    }
  </style>
</head>
<body>
  <div class="container">
    <h1>Dhivakaran Projects</h1>
    <ul>
      <li><a href="../Project/school/index.html" target="_blank">School</a></li>
      <li><a href="../Project/ecommerce/index.html" target="_blank">E Commerce</a></li>
      <li><a href="../Project/Restaurant/index.html" target="_blank">Restaurant</a></li>
    </ul>
  </div>
</body>
</html>
